<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Generator</title>
</head>
<body>
    <h2>Enter a string and a number</h2>
    <form action="/generate" method="post">
        <label for="user_text">Text:</label>
        <input type="text" id="user_text" name="user_text" required>
        <br><br>
        <label for="user_number">Number:</label>
        <input type="number" id="user_number" name="user_number" required>
        <br><br>
        <button type="submit">Generate File</button>
    </form>
</body>
</html>

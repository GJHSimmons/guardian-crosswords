services:
  - type: web
    name: guardian-crosswords
    runtime: python
    rootDir: website
    buildCommand: |
      pip install -r requirements.txt
      cd frontend
      npm ci
      npm run build
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT flask_app:app
    healthCheckPath: /